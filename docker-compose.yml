version: "3.9"

services:
  #----------------------------------------------------------------------------------------------
  # Redis Caches
  #----------------------------------------------------------------------------------------------

  live-auth-redis:
    image: redis:7-alpine
    container_name: redis-cache
    restart: unless-stopped
    ports:
      - "13000:6379"
    volumes:
      - redis_cache_data:/data
    command: ["redis-server", "--appendonly", "yes"]

  live-oauth-redis:
    image: redis:7-alpine
    container_name: redis-oauth
    restart: unless-stopped
    ports:
      - "13001:6379"
    volumes:
      - redis_oauth_data:/data
    command: ["redis-server", "--appendonly", "yes"]

  live-enforce-redis:
    image: redis:7-alpine
    container_name: redis-enforce
    restart: unless-stopped
    ports:
      - "13002:6379"
    command: ["redis-server", "--save", "", "--appendonly", "no"]

  #----------------------------------------------------------------------------------------------
  # UI (Frontend)
  #----------------------------------------------------------------------------------------------

  ui:
    build:
      context: ./ui
      dockerfile: Dockerfile
    container_name: complyage-ui
    restart: unless-stopped
    env_file:
      - ./.env
    ports:
      - "8080:8080"
    depends_on:
      - api
    volumes:
      - ./ui:/app

  #----------------------------------------------------------------------------------------------
  # Gate (Client Loader / Edge)
  #----------------------------------------------------------------------------------------------

  gate:
    build:
      context: ./gate
      dockerfile: Dockerfile
    container_name: complyage-gate
    restart: unless-stopped
    env_file:
      - ./.env
    ports:
      - "8081:8081"
    depends_on:
      - api
      - oauth
    volumes:
      - ./gate:/app

  #----------------------------------------------------------------------------------------------
  # API (Backend)
  #----------------------------------------------------------------------------------------------

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: complyage-api
    restart: unless-stopped
    env_file:
      - ./.env
    ports:
      - "8082:8082"
    depends_on:
      - live-auth-redis
    volumes:
      - ./api:/app

  #----------------------------------------------------------------------------------------------
  # OAuth (Auth Microservice)
  #----------------------------------------------------------------------------------------------

  oauth:
    build:
      context: ./oauth
      dockerfile: Dockerfile
    container_name: complyage-oauth
    restart: unless-stopped
    env_file:
      - ./.env
    ports:
      - "8083:8083"
    depends_on:
      - live-oauth-redis
    volumes:
      - ./oauth:/app

#----------------------------------------------------------------------------------------------
# Volumes
#----------------------------------------------------------------------------------------------

volumes:
  redis_cache_data:
  redis_oauth_data:
  redis_enforce_data:
