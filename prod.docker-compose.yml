version: "3.9"

services:
  #----------------------------------------------------------------------------------------------
  # Redis Caches
  #----------------------------------------------------------------------------------------------

  live-auth-redis:
    image: redis:7-alpine
    container_name: live-redis-cache
    restart: unless-stopped
    ports:
      - "13000:6379"
    volumes:
      - redis_cache_data:/data
    command: ["redis-server", "--appendonly", "yes"]

  live-oauth-redis:
    image: redis:7-alpine
    container_name: live-redis-oauth
    restart: unless-stopped
    ports:
      - "13001:6379"
    volumes:
      - redis_oauth_data:/data
    command: ["redis-server", "--appendonly", "yes"]

  live-enforce-redis:
    image: redis:7-alpine
    container_name: live-redis-enforce
    restart: unless-stopped
    ports:
      - "13002:6379"
    command: ["redis-server", "--save", "", "--appendonly", "no"]

#----------------------------------------------------------------------------------------------
# Volumes
#----------------------------------------------------------------------------------------------

volumes:
  redis_cache_data:
  redis_oauth_data:
  redis_enforce_data: