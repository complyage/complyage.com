#======================================================================
# ComplyAge Reverse Proxy Configuration
#======================================================================

#------------------------------------------------------------
# Redirect all HTTP → HTTPS for all domains
#------------------------------------------------------------

server {
    listen 80;
    server_name complyage.com www.complyage.com api.complyage.com gate.complyage.com oauth.complyage.com;
    return 301 https://$host$request_uri;
}

#======================================================================
# Main UI
#======================================================================

server {
    listen 443 ssl http2;
    server_name complyage.com www.complyage.com;

    ssl_certificate     /etc/letsencrypt/live/complyage.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/complyage.com/privkey.pem;

    root /complyage/complyage.com/ui/dist;
    index index.html;

    location / {
        try_files $uri /index.html;
    }

    # Proxy optional API requests to backend
    location /api/ {
        proxy_pass http://127.0.0.1:8081/;
    }
}

#======================================================================
# API
#======================================================================

server {
    listen 443 ssl http2;
    server_name api.complyage.com;

    ssl_certificate     /etc/letsencrypt/live/complyage.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/complyage.com/privkey.pem;

    location / {
        proxy_pass         http://127.0.0.1:8081;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        #------------------------------------------------------------
        # Preserve cookie domain for all subdomains
        #------------------------------------------------------------
        proxy_cookie_domain complyage.com .complyage.com;
        proxy_cookie_domain api.complyage.com .complyage.com;
        proxy_cookie_domain .complyage.com .complyage.com;
    }
}

#======================================================================
# Gate
#======================================================================

server {
    listen 443 ssl http2;
    server_name gate.complyage.com;

    ssl_certificate     /etc/letsencrypt/live/complyage.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/complyage.com/privkey.pem;

    location / {
        proxy_pass         http://127.0.0.1:8082;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
}

#======================================================================
# OAuth
#======================================================================

server {
    listen 443 ssl http2;
    server_name oauth.complyage.com;

    ssl_certificate     /etc/letsencrypt/live/complyage.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/complyage.com/privkey.pem;

    location / {
        proxy_pass         http://127.0.0.1:8083;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
}
