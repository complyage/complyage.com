#======================================================================
# API
#======================================================================

server {
    listen 443 ssl http2;
    server_name api.complyage.com;

    ssl_certificate     /etc/letsencrypt/live/complyage.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/complyage.com/privkey.pem;

    location / {
        proxy_pass         http://127.0.0.1:8081;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        #------------------------------------------------------------
        # ✅ Handle preflight OPTIONS requests cleanly
        #------------------------------------------------------------
        if ($request_method = OPTIONS) {
            add_header 'Access-Control-Allow-Origin' 'https://complyage.com' always;
            add_header 'Access-Control-Allow-Credentials' 'true' always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type, X-Requested-With' always;
            add_header 'Access-Control-Max-Age' 3600;
            add_header 'Content-Length' 0;
            add_header 'Content-Type' 'text/plain; charset=UTF-8';
            return 204;
        }
    }
}

