<li
      class="flex items-center justify-between p-4 mb-3 bg-black/40 rounded-lg shadow-sm border border-black permission perm{{PERMCODE}} {{PERM_STATUS_{{PERMCODE}}}}">
      <!-- Icon -->
      <div class="flex-shrink-0 w-12 h-12 flex items-center justify-center rounded-full bg-black">
            <img src="/static/img/icons/icon_{{PERMCODE}}.png" alt="{{PERMCODE}} Icon" class="w-8 h-8">
      </div>

      <!-- Content -->
      <div class="flex-1 px-4">
            <h3 class="text-lg font-semibold text-gray-400">
                  {{PERM_PERMCODE_TITLE}}
            </h3>
            <p class="text-sm text-gray-200">
                  {{PERM_PERMCODE_DESC}}
            </p>
      </div>

      <!-- Status -->
      <div class="flex items-center gap-2 bg-gray-800 p-2 rounded-lg">
            <!-- Ready -->
            <img class="status ready w-6 h-6" src="/static/img/icons/icon_READY.png">

            <!-- Missing -->
            <a class="href miss inline-flex items-center text-xl font-medium text-white hover:text-blue-800"
                  href="{{VERIFYURL}}?apiKey={{APIKEY}}&code={{PERMCODE}}" target="_blank">
                  <img class="status miss w-5 h-5 mr-1" src="/static/img/icons/icon_MISS.png">
                  {{::DEFAULT:WORD_VERIFY}}
            </a>

            <!-- Logged Out -->
            <img class="status loggedout w-6 h-6 opacity-60" src="/static/img/icons/icon_NA.png">
      </div>
</li>
