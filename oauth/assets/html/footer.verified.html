<!-- User is Logged Out -->

<div class="flex justify-center items-center p-4 gap-6">      

      <button onclick="loadPreview('{{SCOPE}}', '{{TOKEN}}', '{{PREVIEWKEY}}')" class="btn btn-secondary cursor-pointer px-4 py-2 bg-gray-600 text-white rounded hover:bg-gray-700 font-bold">
            Preview my data
      </button>
      
      <a
            href="/v1/approve?session={{TOKEN}}&key={{AUTHORIZEKEY}}" 
            class="btn btn-primary cursor-pointer px-4 py-2 bg-blue-600 text-white rounded hover:bg-blue-700 font-bold"
      >
            Allow my data
      </a>
      <a 
            href="/v1/deny?session={{TOKEN}}&key={{DENYKEY}}" 
            class="btn btn-secondary cursor-pointer px-4 py-2 bg-gray-600 text-white rounded hover:bg-gray-700 font-bold"
      >
            Deny access to this data
      </a>

</div>
