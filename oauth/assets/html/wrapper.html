<!DOCTYPE html>
<html lang="en" class="h-full">

<head>
      <!--||------------------------------------------------------------------------------------------------||-->
      <!--|| Meta & SEO                                                                                   ||-->
      <!--||------------------------------------------------------------------------------------------------||-->
      <meta charset="UTF-8" />
      <meta http-equiv="X-UA-Compatible" content="IE=edge" />
      <meta name="viewport" content="width=device-width, initial-scale=1.0" />
      <meta name="description" content="{{::DEFAULT:COMPANY}} - {{PAGETITLE}}. Secure, compliant, and accessible." />
      <meta name="theme-color" content="#232323" />

      <!--||------------------------------------------------------------------------------------------------||-->
      <!--|| Title                                                                                         ||-->
      <!--||------------------------------------------------------------------------------------------------||-->
      <title>{{::DEFAULT:COMPANY}} - {{PAGETITLE}}</title>

      <!--||------------------------------------------------------------------------------------------------||-->
      <!--|| CSS                                                                                           ||-->
      <!--||------------------------------------------------------------------------------------------------||-->
      <link rel="preload" href="/static/css/output.css?v={{CACHEBUST}}" as="style" />
      <link href="/static/css/output.css?v={{CACHEBUST}}" rel="stylesheet" />

      <!--||------------------------------------------------------------------------------------------------||-->
      <!--|| Favicons                                                                                      ||-->
      <!--||------------------------------------------------------------------------------------------------||-->
      <link rel="icon" href="/static/img/favicon.ico" sizes="any" />
      <link rel="icon" href="/static/img/favicon.svg" type="image/svg+xml" />
      <link rel="apple-touch-icon" href="/static/img/apple-touch-icon.png" />
</head>

<body class="h-screen font-sans bg-white text-gray-900 text-[1.1em] antialiased">
      <!--||------------------------------------------------------------------------------------------------||-->
      <!--|| Skip Link (Accessibility)                                                                     ||-->
      <!--||------------------------------------------------------------------------------------------------||-->
      <a href="#main-content"
            class="absolute left-[-999px] top-auto w-px h-px overflow-hidden focus:left-2 focus:top-2 focus:w-auto focus:h-auto bg-blue-600 text-white px-4 py-2 rounded-md z-50">
            Skip to main content
      </a>

      <!--||------------------------------------------------------------------------------------------------||-->
      <!--|| Main Layout                                                                                    ||-->
      <!--||------------------------------------------------------------------------------------------------||-->
      <main id="main-content" class="h-screen flex flex-col md:flex-row">
            <!--|| Sidebar / Left Content ||-->
            <aside class="w-full md:w-1/2 h-full bg-gray-100 flex justify-center items-start p-8 overflow-y-auto">
                  <div class="w-full max-w-xl">
                        {{CONTENT_LEFT}}
                  </div>
            </aside>

            <!--|| Main Panel / Right Content ||-->
            <section class="w-full md:w-1/2 h-full flex flex-col bg-[oklch(0.2326_0.014_253.1)] text-white overflow-y-auto">
                  <div class="w-full max-w-4xl mx-auto p-6">
                        {{CONTENT_RIGHT}}
                  </div>
            </section>
      </main>

      <!--||------------------------------------------------------------------------------------------------||-->
      <!--|| JS Helpers                                                                                     ||-->
      <!--||------------------------------------------------------------------------------------------------||-->
      <script>
            document.getElementById("year").textContent = new Date().getFullYear();
      </script>
</body>

</html>
