name: Deploy To Production

on:
  push:
    branches: [main, ALPHA]

jobs:
  build-deploy:
    runs-on: ubuntu-latest

    steps:
      #------------------------------------------------------------
      # Checkout Repository
      #------------------------------------------------------------
      - name: Checkout Repository
        uses: actions/checkout@v3
      #------------------------------------------------------------
      # Setup Node.js
      #------------------------------------------------------------
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18
      #------------------------------------------------------------
      # Install Dependencies
      #------------------------------------------------------------
      - name: Install dependencies
        run: npm ci
      #------------------------------------------------------------
      # Build Project
      #------------------------------------------------------------
      - name: Build project
        run: npm run build
      #------------------------------------------------------------
      # Notify Deployment Server
      #------------------------------------------------------------
      - name: Notify Deployment Server
        run: |
          echo "🚀 Notifying deployment server..."

          DEPLOY_KEY="${{ secrets.DEPLOY_KEY }}"
          DEPLOY_URL="https://deploy.complyage.com/deploy?check=${DEPLOY_KEY}"

          echo "Calling: $DEPLOY_URL"
          RESPONSE=$(curl -s -w "%{http_code}" -o /tmp/resp.txt "$DEPLOY_URL")

          if [ "$RESPONSE" != "200" ]; then
            echo "❌ Deployment trigger failed with HTTP code $RESPONSE"
            echo "--- Server response ---"
            cat /tmp/resp.txt
            echo "-----------------------"
            exit 1
          fi

          echo "✅ Deployment triggered successfully!"
