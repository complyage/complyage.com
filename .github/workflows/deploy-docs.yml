name: Deploy To Production

on:
  push:
    branches: [main, ALPHA]

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs

    steps:
      - uses: actions/checkout@v3

      - uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Install dependencies
        run: npm ci

      - name: Build Docusaurus site
        run: npm run build

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs/build
          publish_branch: gh-pages

      - name: Notify Deployment Server
        run: |
          echo "Notifying deployment server..."
          DEPLOY_URL="https://deploy.complyage.com:9090/deploy"
          DEPLOY_KEY="${{ secrets.DEPLOY_KEY }}"
          DEPLOY_URL="https://complyage.com:9090/deploy?check=${DEPLOY_KEY}"

          echo "Calling: $DEPLOY_URL"

          RESPONSE=$(curl -sk -w "%{http_code}" -o /dev/null "$DEPLOY_URL")

          if [ "$RESPONSE" != "200" ]; then
            echo "❌ Deployment trigger failed with HTTP code $RESPONSE"
            exit 1
          fi

          echo "✅ Deployment triggered successfully!"
