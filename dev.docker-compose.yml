version: "3.9"

services:
  queue-agents:
    image: rabbitmq:3-management
    container_name: rabbitmq
    restart: unless-stopped
    ports:
      - "10000:5672"    # AMQP
      - "10001:15672"   # Management UI
    env_file:
      - ./.env
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

  db-main:
    image: mariadb:11
    container_name: mariadb
    restart: unless-stopped
    env_file:
      - ./.env
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_PASSWORD}
      MARIADB_DATABASE: ${DB_NAME}
      MARIADB_USER: ${DB_USER}
      MARIADB_PASSWORD: ${DB_PASSWORD}
    ports:
      - "11000:3306"
    volumes:
      - mariadb_data:/var/lib/mysql

  verifications-storage:
    image: minio/minio:latest
    container_name: minio
    restart: unless-stopped
    ports:
      - "12000:9000"    # S3 API
      - "12001:9001"    # MinIO Console UI
    env_file:
      - ./.env
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data      

  auth-redis:
    image: redis:7-alpine
    container_name: redis-cache
    restart: unless-stopped
    ports:
      - "13000:6379"
    volumes:
      - redis_cache_data:/data
    command: ["redis-server", "--appendonly", "yes"]

  mock:
    build:
      context: ./mock     # directory containing your Dockerfile
      dockerfile: Dockerfile
    container_name: mock-app
    restart: unless-stopped
    ports:
      - "8080:80"   # expose Apache on localhost:8080
    volumes:
      - ./mock:/var/www/html
    depends_on:
      - db-main
      - auth-redis
      - oauth-redis
      - queue-agents
      - verifications-storage
    environment:
      DB_HOST: db-main
      DB_USER: ${DB_USER}
      DB_PASS: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      
  oauth-redis:
    image: redis:7-alpine
    container_name: redis-oauth
    restart: unless-stopped
    ports:
      - "13001:6379"
    volumes:
      - redis_oauth_data:/data
    command: ["redis-server", "--appendonly", "yes"]

  enforce-redis:
    image: redis:7-alpine
    container_name: redis-enforce
    restart: unless-stopped
    ports:
      - "13002:6379"
    command: ["redis-server", "--save", "", "--appendonly", "no"]

  mc-init:
    image: minio/mc:latest
    container_name: mc-init
    depends_on:
      - verifications-storage
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://verifications-storage:9000 ${MINIO_ACCESS_KEY} ${MINIO_SECRET_KEY}; do
        echo '⏳ Waiting for MinIO...'; sleep 2;
      done &&
      mc mb --ignore-existing local/sites &&
      mc anonymous set download local/sites &&
      echo '✅ sites bucket ready';
      exit 0
      "
  

volumes:
  rabbitmq_data:
  mariadb_data:
  minio_data:
  redis_cache_data:
  redis_oauth_data:
  redis_enforce_data: